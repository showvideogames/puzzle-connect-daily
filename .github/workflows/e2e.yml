name: End-to-end tests

# Runs on every pull request, and on demand. Deliberately NOT on pushes to
# main: the point is to review a change before it lands, and a second
# identical run after the merge costs minutes without answering a new
# question.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        type: choice
        default: smoke
        options: [smoke, full]

# A new push to the same PR supersedes the previous run.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow needs NO secrets. Everything it talks to is a container it
# started itself; the keys involved are the Supabase CLI's local demo keys,
# read out of `supabase status` at run time. If you ever find yourself adding
# a secret here, something has gone wrong with the isolation.
permissions:
  contents: read

jobs:
  # Fast gate. Applies the pre-git baseline plus every migration to a clean
  # in-process Postgres and runs the whole seed through the app's own RPCs.
  # No Docker, no browser — about ten seconds, and it catches a broken
  # migration or an invalid fixture before anything slower starts.
  schema:
    name: Schema and fixtures (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply every migration to a clean database and seed it
        run: npm run e2e:db:verify

  browser:
    name: Browser suite (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: schema
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser binaries are large and version-pinned by the installed
      # Playwright; keying the cache on the lockfile means a Playwright
      # upgrade invalidates it automatically.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The runner already has Docker, which is what the local Supabase stack
      # needs. Nothing here touches a hosted project: the E2E project
      # directory (e2e/supabase) is linked to nothing at all.
      #
      # The first start pulls the Postgres/GoTrue/PostgREST/Kong images, which
      # is the slowest step in this job (a few minutes). GitHub-hosted runners
      # are ephemeral, so there is nothing to cache them in; that is why the
      # job's timeout is generous and the fast `schema` gate runs first.
      - name: Start the disposable Supabase stack
        run: npm run e2e:up

      - name: Apply the schema from scratch and seed the fixtures
        run: npm run e2e:reset

      # A pull request always gets the whole critical suite — it is small by
      # design. The manual trigger can ask for just the smoke subset when
      # someone only wants a quick answer.
      - name: Run the end-to-end suite
        run: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.suite == 'smoke')
              && 'npm run e2e:smoke'
              || 'npm run e2e:test' }}

      # Artifacts only when something went wrong. The HTML report embeds the
      # traces and screenshots Playwright captured under `retain-on-failure`,
      # which is what makes a CI failure diagnosable without a re-run.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.artifacts/report
          retention-days: 14

      - name: Upload traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/.artifacts/test-results
          retention-days: 14

      # The stack's own logs explain a failure that the browser could only
      # see as a 500.
      - name: Upload Supabase container logs
        if: failure()
        run: npx supabase status --workdir e2e || true

      # `always()` so a failed suite still tears the containers down rather
      # than leaving them holding ports on a self-hosted runner.
      - name: Stop the stack
        if: always()
        run: npm run e2e:down -- --purge
