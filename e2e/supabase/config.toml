# The DISPOSABLE Supabase project used by the end-to-end tests.
#
# This is a second, deliberately separate Supabase project directory. The
# repository's real one lives at ../../supabase and is linked to the
# production project; this one is linked to nothing, which is the point:
#
#   * `supabase link` / `db push` cannot reach production from here, because
#     there is no project ref to push to.
#   * Every port below is outside the CLI's default 54321-54329 range, so an
#     ordinary `supabase start` for this repo and the E2E stack can never be
#     the same container set — including by accidentally attaching to one
#     that is already running.
#   * `migrations/` is intentionally EMPTY. `supabase start` therefore applies
#     no schema at all; `npm run e2e:reset` applies the repository's real
#     migrations itself, in a controlled order, after the pre-git baseline.
#     See e2e/scripts/reset.ts and e2e/README.md.
#
# Nothing here is a secret. The local stack's keys are demo JWTs generated by
# the CLI; `npm run e2e:up` reads them out of `supabase status` and writes
# .env.e2e, which is git-ignored.

project_id = "rainbow-categories-e2e"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54423

# Local mail catcher. Confirmations are disabled below, so nothing depends on
# it, but keeping it on means a password-reset test can be added later
# without changing this file.
[local_smtp]
enabled = true
port = 54424

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5183"
additional_redirect_urls = ["http://127.0.0.1:5183", "http://localhost:5183"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = false
# Test accounts are created through the admin API with the address already
# confirmed, and a browser sign-up in a test must not need a mail round trip.
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[realtime]
enabled = false
