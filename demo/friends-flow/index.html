<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <!-- Nothing here may reach another address. Vite's dev script is inline, hence unsafe-inline. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'"
    />
    <title>Friends and Groups mock preview</title>
  </head>
  <body>
    <div class="preview-root">
      <header class="preview-bar" data-testid="banner">
        <p class="preview-bar-title"><strong>Mock.</strong> No real accounts. Nothing is sent anywhere, and everything is gone on reload.</p>
      </header>
      <div id="root"></div>
      <main class="preview-body" data-testid="blocked" hidden>This preview only runs on this computer.</main>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
